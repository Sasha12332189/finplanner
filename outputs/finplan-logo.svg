<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">finplan logo</title>
  <desc id="desc">A calm wordmark logo for a personal finance planner.</desc>
  <rect width="1600" height="600" rx="48" fill="#F6F6F3"/>
  <!-- Icon: two simple, interlocking strokes for finance and plan. -->
  <g transform="translate(170 140)" fill="none" stroke="#829384" stroke-linecap="round" stroke-linejoin="round" stroke-width="42">
    <path d="M126 270V106c0-43 28-68 68-68h31"/>
    <path d="M78 184h160"/>
    <path d="M240 270V108c0-44 27-70 70-70 48 0 76 31 76 78 0 49-30 80-76 80h-70"/>
  </g>
  <!-- Wordmark: the contrast comes from weight, not loud colour. -->
  <text x="640" y="352" fill="#292D2A" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="188" font-weight="650" letter-spacing="-10">fin</text>
  <text x="866" y="352" fill="#829384" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="188" font-weight="650" letter-spacing="-10">plan</text>
  <text x="646" y="434" fill="#6F756F" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="1.8">PERSONAL FINANCE, SIMPLIFIED</text>
</svg>
