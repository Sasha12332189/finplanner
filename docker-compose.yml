services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/finplan.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/finplan.db
    volumes:
      - ./data:/app/data
